<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        table {
            width: 80vw;
            border-collapse: collapse;
            margin: auto;
        }

        th, td {
            border: 2px solid red;
            padding: 8px;
            text-align: center;
        }
    </style>

    <script>
        const URL = "https://dummyjson.com/products?limit=10";

        async function loadProducts() {
            try {
                const res = await fetch(URL);
                console.log("res =", res);

                const data = await res.json();
                console.log("data =", data.products);

                let rows = "";

                data.products.map((i, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${i.title}</td>
                            <td>${i.category}</td>
                            <td>${i.rating}</td>
                            <td>${i.price}</td>
                            <td>${i.stock}</td>
                        </tr>
                    `;
                });

                document.getElementById("productRows").innerHTML = rows;

            } catch (err) {
                console.log("Error:", err);
            }
        }

        loadProducts();
    </script>
</head>

<body>

    <h1 style="text-align: center;">List of Products</h1>

    <table>
        <thead>
            <tr>
                <th>Sr. No</th>
                <th>Title</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price ($)</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="productRows">
        </tbody>
    </table>

</body>
</html>
